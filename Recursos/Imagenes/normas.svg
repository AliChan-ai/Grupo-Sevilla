<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" role="img" aria-label="Normas de colaboración: commits claros, prefijos normalizados, bitácora al día, nomenclatura de archivos y revisión cruzada" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="c0"><rect x="20" y="10" width="860" height="88" rx="12"/></clipPath>
    <clipPath id="c1"><rect x="20" y="110" width="860" height="88" rx="12"/></clipPath>
    <clipPath id="c2"><rect x="20" y="210" width="860" height="88" rx="12"/></clipPath>
    <clipPath id="c3"><rect x="20" y="310" width="860" height="88" rx="12"/></clipPath>
    <clipPath id="c4"><rect x="20" y="410" width="860" height="88" rx="12"/></clipPath>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}
    .card{opacity:0;animation:slide 12s ease-out infinite}
    .bg{fill:#0d1117;stroke:#30363d;stroke-width:1.5}
    .title{font-size:17px;font-weight:700;fill:#ffffff}
    .desc{font-size:13px;fill:#9da7b3}
    .numt{font-size:15px;font-weight:700;fill:#ffffff;text-anchor:middle}
    .ex{font-size:12px;fill:#e6edf3}
    .exbox{fill:#161b22;stroke:#30363d;stroke-width:1}
    .ring{fill:none;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
    .sweep{animation:sweep 6s linear infinite}
    @keyframes slide{0%{opacity:0;transform:translateX(-50px)}5%{opacity:1;transform:translateX(0)}90%{opacity:1;transform:translateX(0)}96%,100%{opacity:0;transform:translateX(0)}}
    @keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
    @keyframes sweep{0%{transform:translateX(-260px)}100%{transform:translateX(1000px)}}
  </style>

  <g class="card" style="animation-delay:0.0s">
    <rect class="bg" x="20" y="10" width="860" height="88" rx="12"/>
    <rect x="20" y="10" width="6" height="88" rx="3" fill="#5865F2"/>
    <g clip-path="url(#c0)"><rect class="sweep" x="0" y="10" width="220" height="88" fill="url(#shine)" style="animation-delay:0.0s"/></g>
    <circle class="ring" cx="70" cy="54" r="24" stroke="#5865F2" style="animation-delay:0.0s"/>
    <circle cx="70" cy="54" r="24" fill="#5865F2"/>
    <text class="sans numt" x="70" y="59">01</text>
    <text class="sans title" x="116" y="47">Commits claros</text>
    <text class="sans desc" x="116" y="72">Se escriben en español, en imperativo: «tipo: descripción».</text>
    <rect class="exbox" x="600" y="27" width="262" height="54" rx="8"/>
    <text class="mono ex" x="731" y="58" text-anchor="middle">docs: añadir justificación de roles</text>
  </g>

  <g class="card" style="animation-delay:0.6s">
    <rect class="bg" x="20" y="110" width="860" height="88" rx="12"/>
    <rect x="20" y="110" width="6" height="88" rx="3" fill="#7B2CBF"/>
    <g clip-path="url(#c1)"><rect class="sweep" x="0" y="110" width="220" height="88" fill="url(#shine)" style="animation-delay:0.6s"/></g>
    <circle class="ring" cx="70" cy="154" r="24" stroke="#7B2CBF" style="animation-delay:0.6s"/>
    <circle cx="70" cy="154" r="24" fill="#7B2CBF"/>
    <text class="sans numt" x="70" y="159">02</text>
    <text class="sans title" x="116" y="147">Prefijos normalizados</text>
    <text class="sans desc" x="116" y="172">Cada commit lleva prefijo: docs, feat, fix o chore.</text>
    <rect class="exbox" x="600" y="127" width="262" height="54" rx="8"/>
    <text class="mono ex" x="731" y="158" text-anchor="middle">feat: añadir script de backup</text>
  </g>

  <g class="card" style="animation-delay:1.2s">
    <rect class="bg" x="20" y="210" width="860" height="88" rx="12"/>
    <rect x="20" y="210" width="6" height="88" rx="3" fill="#3A86FF"/>
    <g clip-path="url(#c2)"><rect class="sweep" x="0" y="210" width="220" height="88" fill="url(#shine)" style="animation-delay:1.2s"/></g>
    <circle class="ring" cx="70" cy="254" r="24" stroke="#3A86FF" style="animation-delay:1.2s"/>
    <circle cx="70" cy="254" r="24" fill="#3A86FF"/>
    <text class="sans numt" x="70" y="259">03</text>
    <text class="sans title" x="116" y="247">Bitácora al día</text>
    <text class="sans desc" x="116" y="272">Lo de cada día va a Bitacora/Diario/ y cada semana se resume en Semanal.md.</text>
    <rect class="exbox" x="600" y="227" width="262" height="54" rx="8"/>
    <text class="mono ex" x="731" y="258" text-anchor="middle">Diario/   →   Semanal.md</text>
  </g>

  <g class="card" style="animation-delay:1.7999999999999998s">
    <rect class="bg" x="20" y="310" width="860" height="88" rx="12"/>
    <rect x="20" y="310" width="6" height="88" rx="3" fill="#5865F2"/>
    <g clip-path="url(#c3)"><rect class="sweep" x="0" y="310" width="220" height="88" fill="url(#shine)" style="animation-delay:1.7999999999999998s"/></g>
    <circle class="ring" cx="70" cy="354" r="24" stroke="#5865F2" style="animation-delay:1.7999999999999998s"/>
    <circle cx="70" cy="354" r="24" fill="#5865F2"/>
    <text class="sans numt" x="70" y="359">04</text>
    <text class="sans title" x="116" y="347">Nombres de archivos</text>
    <text class="sans desc" x="116" y="372">Sin espacios ni tildes: Nombre_Documento.md.</text>
    <rect class="exbox" x="600" y="327" width="262" height="54" rx="8"/>
    <text class="mono ex" x="731" y="350" text-anchor="middle" style="fill:#7ee787">✔ Justificacion_Roles.md</text>
    <text class="mono ex" x="731" y="369" text-anchor="middle" style="fill:#ff7b72">✘ Justificación roles.md</text>
  </g>

  <g class="card" style="animation-delay:2.4s">
    <rect class="bg" x="20" y="410" width="860" height="88" rx="12"/>
    <rect x="20" y="410" width="6" height="88" rx="3" fill="#7B2CBF"/>
    <g clip-path="url(#c4)"><rect class="sweep" x="0" y="410" width="220" height="88" fill="url(#shine)" style="animation-delay:2.4s"/></g>
    <circle class="ring" cx="70" cy="454" r="24" stroke="#7B2CBF" style="animation-delay:2.4s"/>
    <circle cx="70" cy="454" r="24" fill="#7B2CBF"/>
    <text class="sans numt" x="70" y="459">05</text>
    <text class="sans title" x="116" y="447">Revisión entre compañeros</text>
    <text class="sans desc" x="116" y="472">Los cambios importantes los revisa otra persona del grupo.</text>
    <rect class="exbox" x="600" y="427" width="262" height="54" rx="8"/>
    <text class="mono ex" x="731" y="458" text-anchor="middle">Autor  →  Revisor  →  OK</text>
  </g>
</svg>
