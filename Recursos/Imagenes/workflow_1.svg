<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="900" height="170" role="img" aria-label="Metodología de trabajo: planificar, organizar, desarrollar, documentar" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .box{fill:#0d1117;stroke:#30363d;stroke-width:1.5}
    .glow{fill:none;stroke-width:3;opacity:.25;animation:glow 8s ease-in-out infinite}
    .g1{stroke:#DC2626;animation-delay:0s}
    .g2{stroke:#991B1B;animation-delay:2s}
    .g3{stroke:#FF4D4D;animation-delay:4s}
    .g4{stroke:#8b949e;animation-delay:6s}
    .num{font:700 12px 'JetBrains Mono',Consolas,monospace;text-anchor:middle}
    .t{font:700 16px 'Segoe UI',Arial,sans-serif;fill:#ffffff;text-anchor:middle;letter-spacing:2px}
    .s{font:400 12px 'Segoe UI',Arial,sans-serif;fill:#9da7b3;text-anchor:middle}
    .flow{stroke:#DC2626;stroke-width:2;stroke-dasharray:6 6;animation:dash 1s linear infinite}
    .dot{fill:#991B1B}
    @keyframes dash{to{stroke-dashoffset:-12}}
    @keyframes glow{0%{opacity:.2}6%{opacity:1}25%{opacity:1}31%{opacity:.2}100%{opacity:.2}}
  </style>

  <!-- Conectores animados -->
  <line class="flow" x1="205" y1="85" x2="245" y2="85"/>
  <line class="flow" x1="430" y1="85" x2="470" y2="85"/>
  <line class="flow" x1="655" y1="85" x2="695" y2="85"/>
  <circle class="dot" r="4" cy="85"><animate attributeName="cx" values="205;245" dur="1.6s" repeatCount="indefinite"/></circle>
  <circle class="dot" r="4" cy="85"><animate attributeName="cx" values="430;470" dur="1.6s" begin="0.5s" repeatCount="indefinite"/></circle>
  <circle class="dot" r="4" cy="85"><animate attributeName="cx" values="655;695" dur="1.6s" begin="1s" repeatCount="indefinite"/></circle>

  <!-- 01 -->
  <rect class="box" x="20" y="35" width="185" height="100" rx="10"/>
  <rect class="glow g1" x="20" y="35" width="185" height="100" rx="10"/>
  <text class="num" x="112" y="62" fill="#DC2626">01</text>
  <text class="t" x="112" y="88">PLANIFICAR</text>
  <text class="s" x="112" y="110">Objetivos y plazos</text>

  <!-- 02 -->
  <rect class="box" x="245" y="35" width="185" height="100" rx="10"/>
  <rect class="glow g2" x="245" y="35" width="185" height="100" rx="10"/>
  <text class="num" x="337" y="62" fill="#991B1B">02</text>
  <text class="t" x="337" y="88">ORGANIZAR</text>
  <text class="s" x="337" y="110">Roles y entregables</text>

  <!-- 03 -->
  <rect class="box" x="470" y="35" width="185" height="100" rx="10"/>
  <rect class="glow g3" x="470" y="35" width="185" height="100" rx="10"/>
  <text class="num" x="562" y="62" fill="#FF4D4D">03</text>
  <text class="t" x="562" y="88">DESARROLLAR</text>
  <text class="s" x="562" y="110">Implementación y pruebas</text>

  <!-- 04 -->
  <rect class="box" x="695" y="35" width="185" height="100" rx="10"/>
  <rect class="glow g4" x="695" y="35" width="185" height="100" rx="10"/>
  <text class="num" x="787" y="62" fill="#8b949e">04</text>
  <text class="t" x="787" y="88">DOCUMENTAR</text>
  <text class="s" x="787" y="110">Registro y trazabilidad</text>
</svg>
