<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 370" width="860" height="370" role="img" aria-label="Estructura del repositorio: Bitacora, Documentacion, Recursos, Como hacer bitacora y README.md" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#5865F2"/><stop offset="1" stop-color="#7B2CBF"/></linearGradient>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}
    .tree{font-size:17px;fill:#8b949e}
    .name{font-size:17px;font-weight:700}
    .com{font-size:13px;fill:#6e7681}
    .prompt{font-size:16px;fill:#7ee787}
    .cmd{font-size:16px;fill:#e6edf3}
    .row{opacity:0;animation:appear 10s ease-out infinite}
    .cursor{animation:blink 1s steps(1) infinite}
    .dotg{animation:pulse 2.4s ease-in-out infinite}
    @keyframes appear{0%{opacity:0;transform:translateX(-14px)}6%{opacity:1;transform:translateX(0)}88%{opacity:1;transform:translateX(0)}95%,100%{opacity:0;transform:translateX(0)}}
    @keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  </style>

  <rect x="1" y="1" width="858" height="368" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="1" y="1" width="858" height="44" rx="14" fill="#161b22"/>
  <rect x="1" y="30" width="858" height="15" fill="#161b22"/>
  <rect x="1" y="44" width="858" height="2" fill="url(#bar)"/>
  <circle cx="26" cy="23" r="6" fill="#ff5f56" class="dotg"/>
  <circle cx="48" cy="23" r="6" fill="#ffbd2e" class="dotg" style="animation-delay:.4s"/>
  <circle cx="70" cy="23" r="6" fill="#27c93f" class="dotg" style="animation-delay:.8s"/>
  <text x="430.0" y="28" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">grupo-sevilla — estructura del repositorio</text>

  <g class="row" style="animation-delay:0s">
    <text x="30" y="88" class="mono prompt">➜</text>
    <text x="55" y="88" class="mono cmd">tree <tspan fill="#79c0ff">Grupo-Sevilla</tspan></text>
  </g>
  <g class="row" style="animation-delay:.3s"><text x="30" y="124" class="mono tree">.</text></g>
  <g class="row" style="animation-delay:0.7s">
    <text x="30" y="160" class="mono tree">├──</text>
    <text x="82" y="160" class="mono name" fill="#3A86FF">📓 Bitacora/</text>
    <text x="400" y="160" class="mono com"># Seguimiento y evolución del trabajo</text>
  </g>
  <g class="row" style="animation-delay:1.2s">
    <text x="30" y="194" class="mono tree">├──</text>
    <text x="82" y="194" class="mono name" fill="#5865F2">📚 Documentacion/</text>
    <text x="400" y="194" class="mono com"># Documentos principales del proyecto</text>
  </g>
  <g class="row" style="animation-delay:1.7s">
    <text x="30" y="228" class="mono tree">├──</text>
    <text x="82" y="228" class="mono name" fill="#7B2CBF">🛠️ Recursos/</text>
    <text x="400" y="228" class="mono com"># Scripts, diagramas e imágenes</text>
  </g>
  <g class="row" style="animation-delay:2.2s">
    <text x="30" y="262" class="mono tree">├──</text>
    <text x="82" y="262" class="mono name" fill="#8b949e">📄 Como hacer bitacora</text>
    <text x="400" y="262" class="mono com"># Guía para registrar la bitácora</text>
  </g>
  <g class="row" style="animation-delay:2.7s">
    <text x="30" y="296" class="mono tree">└──</text>
    <text x="82" y="296" class="mono name" fill="#8b949e">📘 README.md</text>
    <text x="400" y="296" class="mono com"># Presentación del repositorio</text>
  </g>
  <text x="30" y="336" class="mono prompt">➜</text>
  <rect class="cursor" x="55" y="322" width="10" height="19" fill="#e6edf3"/>
</svg>
